name: Build and Release Executable

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build portable executable
        run: npm run build

      - name: Create GitHub Release and Upload Exe
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/AION2-World-Timers-Overlay.exe
          name: AION 2 In-Game World Timers Overlay ${{ github.ref_name }}
          body: |
            ### ✨ AION 2 In-Game World Timers Overlay (${{ github.ref_name }})
            
            Download `AION2-World-Timers-Overlay.exe` below and double-click to run!
            
            - **No installation needed**: Runs as a single portable file.
            - **Local Machine Time Synchronized**: Automatically converts server schedules (US East, US West, Europe, Korea, Taiwan, UTC) to your local clock.
            - **Ghost Mode (F10)**: Press `F10` to toggle click-through and semi-transparency while gaming.
            - **Audio Warning Chimes**: 5-min warning, 1-min warning, and spawn alerts.
          draft: false
          prerelease: false
